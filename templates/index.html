<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ComicCraft - AI Comic Story Creator</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; font-family: "Segoe UI", Arial, sans-serif; color: #222;
           background: #cfe8ff url('/static/img/background.svg') center/cover fixed no-repeat; }
    .wrap { max-width: 640px; margin: 0 auto; padding: 32px 16px; }
    .card { background: rgba(255,255,255,.93); border-radius: 16px; padding: 28px;
            box-shadow: 0 8px 28px rgba(0,0,0,.25); }
    h1 { margin: 0 0 4px; font-size: 2rem; color: #b3261e; letter-spacing: .5px; }
    p.sub { margin: 0 0 20px; color: #555; }
    label { display: block; margin: 14px 0 6px; font-weight: 600; }
    input, textarea, select { width: 100%; padding: 10px 12px; border: 1px solid #bbb; border-radius: 8px;
                              font: inherit; background: #fff; }
    textarea { min-height: 90px; resize: vertical; }
    button { margin-top: 22px; width: 100%; padding: 13px; border: 0; border-radius: 10px; font-size: 1.05rem;
             font-weight: 700; color: #fff; background: #b3261e; cursor: pointer; transition: .2s; }
    button:hover { background: #8c1d18; transform: translateY(-1px); }
    button:disabled { background: #999; cursor: wait; }
    .error { background: #fdecea; border-left: 5px solid #b3261e; padding: 10px 14px; border-radius: 6px; margin-bottom: 8px; }
    #loading { display: none; margin-top: 14px; text-align: center; color: #444; font-style: italic; }
  </style>
</head>
<body>
  <div class="wrap"><div class="card">
    <h1>ComicCraft</h1>
    <p class="sub">Turn a simple idea into a 5-panel AI comic - story, art and PDF.</p>

    {% if error %}<div class="error" role="alert">{{ error }}</div>{% endif %}

    <form id="comic-form" action="/generate" method="post">
      <label for="story_prompt">Story prompt</label>
      <textarea id="story_prompt" name="story_prompt" required minlength="5" maxlength="500"
        placeholder="A brave fox exploring an enchanted forest">{{ form.story_prompt or "" }}</textarea>

      <label for="character_name">Main character name</label>
      <input id="character_name" name="character_name" required maxlength="40" placeholder="Rusty"
             value="{{ form.character_name or '' }}">

      <label for="setting">Setting</label>
      <select id="setting" name="setting">
        {% for o in ["forest", "school", "space", "city"] %}
        <option value="{{ o }}" {{ "selected" if form.setting == o }}>{{ o|capitalize }}</option>{% endfor %}
      </select>

      <label for="tone">Story tone</label>
      <select id="tone" name="tone">
        {% for o in ["light-hearted", "dramatic", "poetic", "funny"] %}
        <option value="{{ o }}" {{ "selected" if form.tone == o }}>{{ o|capitalize }}</option>{% endfor %}
      </select>

      <label for="art_style">Art style</label>
      <select id="art_style" name="art_style">
        {% for o in ["anime", "pixel art", "comic book", "realistic"] %}
        <option value="{{ o }}" {{ "selected" if form.art_style == o }}>{{ o|capitalize }}</option>{% endfor %}
      </select>

      <button id="submit-btn" type="submit">Create my comic</button>
      <div id="loading">Writing the story and drawing the panels - this can take a few minutes...</div>
    </form>
  </div></div>
  <script>
    document.getElementById("comic-form").addEventListener("submit", function () {
      var b = document.getElementById("submit-btn");
      b.disabled = true; b.textContent = "Creating...";
      document.getElementById("loading").style.display = "block";
    });
  </script>
</body>
</html>
